<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BrandMorph v0.3</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#030C1E;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px}
h1{color:#FFB81C;font-size:2em;margin-bottom:8px}
.sub{color:#8899aa;margin-bottom:32px}
.card{background:#081632;border:1px solid #1a2a4a;border-radius:12px;padding:24px;width:100%;max-width:720px;margin-bottom:16px}
.drop{border:2px dashed #FFB81C;border-radius:8px;padding:48px;text-align:center;cursor:pointer;transition:border-color .3s}
.drop:hover,.drop.over{border-color:#00FFFF;background:rgba(255,184,28,.05)}
.btn{background:#FFB81C;color:#030C1E;border:none;padding:12px 32px;border-radius:6px;font-size:16px;font-weight:bold;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.spin{width:40px;height:40px;border:3px solid #FFB81C33;border-top-color:#FFB81C;border-radius:50%;animation:sp 1s linear infinite;margin:20px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.badge{padding:3px 12px;border-radius:10px;font-size:12px;font-weight:bold;display:inline-block;margin:2px}
.b-title{background:#4a3a1a;color:#FFB81C}
.b-agenda{background:#1a3a4a;color:#00FFFF}
.b-content{background:#1a2a3a;color:#8899aa}
.b-case{background:#2a1a3a;color:#CE93D8}
.b-thank{background:#1a4a2a;color:#4CAF50}
.b-generic{background:#222;color:#888}
.b-minimal{background:#1a1a2a;color:#666}
.b-unknown{background:#333;color:#999}
.slide-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #0d1a3a}
.slide-row:last-child{border:none}
.slide-num{font-weight:bold;color:#FFB81C;min-width:70px}
.type-badge{min-width:160px;text-align:center}
.hidden{display:none}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0}
.stat{text-align:center;padding:12px;background:#0a1a3a;border-radius:8px}
.stat .num{font-size:28px;font-weight:bold;color:#FFB81C}
.stat .lbl{font-size:12px;color:#8899aa}
.integrity{padding:8px 16px;border-radius:6px;font-weight:bold;text-align:center;margin:12px 0}
.integrity.ok{background:#1a4a2a;color:#4CAF50}
.integrity.fail{background:#4a1a1a;color:#f66}
</style>
</head><body>
<h1>BrandMorph</h1><p class="sub">Template-driven deck brandification · v0.3</p>

<div id="upload" class="card">
<div class="drop" id="dz" onclick="document.getElementById('f').click()">
<p style="font-size:18px;margin-bottom:8px">Drop your PowerPoint here</p>
<p style="color:#667">or click to browse — it will be rebranded using the Akkodis template</p>
<input type="file" id="f" accept=".pptx" style="display:none" onchange="handleFile(this.files[0])">
</div><br>
<button class="btn" id="btn" disabled onclick="process()">Transform Deck</button>
</div>

<div id="processing" class="card hidden">
<div class="spin"></div><p id="ptext" style="text-align:center">Uploading deck...</p>
</div>

<div id="results" class="card hidden">
<h2 style="margin-bottom:8px">Deck Transformed</h2>
<p style="color:#8899aa;margin-bottom:16px" id="integrity-line"></p>
<div class="summary-grid" id="type-grid"></div>
<h3 style="margin:16px 0 8px;color:#8899aa;font-size:14px">SLIDE BREAKDOWN</h3>
<div id="slides"></div>
<br>
<button class="btn" onclick="location.href='/api/v01/export/'+deckId">Download Branded PPTX</button>
</div>

<script>
let deckId=null,file=null;
const dz=document.getElementById('dz');
dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};
dz.ondragleave=()=>dz.classList.remove('over');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');handleFile(e.dataTransfer.files[0])};
function handleFile(f){if(!f||!f.name.endsWith('.pptx'))return alert('Please select a .pptx file');file=f;document.getElementById('btn').disabled=false;dz.querySelector('p').textContent=f.name+' ('+(f.size/1024/1024).toFixed(1)+' MB)'}
async function process(){if(!file)return;show('processing');setText('Uploading deck...');
const fd=new FormData();fd.append('file',file);
try{setText('Matching slides to brand template...');const r=await fetch('/api/v01/process',{method:'POST',body:fd});if(!r.ok){const e=await r.json();throw new Error(e.detail||r.statusText)}
const d=await r.json();deckId=d.deck_id;renderResults(d)}catch(e){alert('Error: '+e.message);show('upload')}
}
function show(id){['upload','processing','results'].forEach(s=>document.getElementById(s).classList.toggle('hidden',s!==id))}
function setText(t){document.getElementById('ptext').textContent=t}
function typeBadge(t){const cls={'TITLE':'b-title','AGENDA':'b-agenda','CASE_STUDY':'b-case','THANK_YOU':'b-thank','GENERIC_CONTENT':'b-content','GENERIC_MINIMAL':'b-minimal','WHO_WE_ARE':'b-agenda','SECTION_SPLITTER':'b-case'}[t]||'b-unknown';return `<span class="badge ${cls}">${t}</span>`}
function renderResults(d){
const integ=d.integrity||{};
const mut=d.mutations_summary||{};
const slides=d.slides||[];
const byStage=mut.by_stage||{};
const binaryOk=integ.binary_changed||false;
document.getElementById('integrity-line').innerHTML=binaryOk?
'<div class="integrity ok">✓ Output verified — '+mut.total+' mutations applied</div>':
'<div class="integrity fail">⚠ Output may be identical to input</div>';
document.getElementById('type-grid').innerHTML=`
<div class="stat"><div class="num">${d.n_slides||0}</div><div class="lbl">Slides</div></div>
<div class="stat"><div class="num">${byStage.TEMPLATE_BG||0}</div><div class="lbl">BG Images</div></div>
<div class="stat"><div class="num">${byStage.TYPOGRAPHY||0}</div><div class="lbl">Typography</div></div>
<div class="stat"><div class="num">${byStage.BRAND_FILL||0}</div><div class="lbl">Brand Fills</div></div>
<div class="stat"><div class="num">${mut.total||0}</div><div class="lbl">Total Mutations</div></div>`;
const sc=document.getElementById('slides');sc.innerHTML='';
slides.forEach(s=>{
const row=document.createElement('div');row.className='slide-row';
row.innerHTML=`<span class="slide-num">Slide ${s.slide}</span> ${typeBadge(s.type)} <span class="badge b-apply">${s.mutations} mutations</span>`;
sc.appendChild(row)});
show('results')}
</script></body></html>
